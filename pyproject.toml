[project]
name = "kz-labor-rag"
version = "0.1.0"
description = "RAG-система вопрос-ответ по Трудовому кодексу РК с измеренным улучшением поиска относительно наивного baseline"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "selectolax>=0.3.21",
    "numpy>=1.26",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.scripts]
kzrag-eval = "kz_labor_rag.cli:main"
kzrag-corpus = "kz_labor_rag.corpus.cli:main"
kzrag-index = "kz_labor_rag.index_cli:main"
kzrag-search = "kz_labor_rag.debug_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kz_labor_rag = ["eval/prompts/*.txt", "eval/prompts/REGISTRY.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Фикстуры разметки — куски настоящего HTML, переносить их нельзя.
"tests/test_parser.py" = ["E501"]
